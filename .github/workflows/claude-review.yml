name: Claude Code Review

# Shared review job, called from a small workflow in each repository:
#
# name: Claude Code Review
# on:
#   workflow_run:
#     workflows: ["CI"]
#     types: [completed]
#   workflow_dispatch:
#     inputs:
#       pr_number:
#         description: PR number to review
#         required: true
# jobs:
#   review:
#     uses: billy-the-ape/claude-plugins/.github/workflows/claude-review.yml@main
#     secrets:
#       CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#     with:
#       pr_number: ${{ inputs.pr_number }}
#     permissions:
#       contents: read
#       pull-requests: write
#       issues: write
#       actions: read
#       id-token: write
#       statuses: write
#
# The triggers live in the caller because a reusable workflow cannot listen for
# workflow_run itself. Being triggered by CI finishing, rather than by the pull
# request, means the review reads CI's result instead of reproducing it.
#
# A called workflow sees the caller's github context, so github.event_name,
# github.repository and github.event.workflow_run below all describe the calling
# repository's run. The caller's permissions block is a ceiling: a permission
# missing there is missing here, whatever the job below asks for.
#
# The caller passes the token by name, not with `secrets: inherit`. GitHub only
# honours `inherit` between repositories in the same organization or
# enterprise, and a personal account is neither, so a caller owned by anyone
# other than billy-the-ape (an organization repository included) passes nothing
# through it. The token then resolves to empty with no error until the action
# fails on auth. Passing it by name works from any owner, and hands this
# workflow that one secret instead of every secret the calling repository
# holds. Callers in this account that still use `secrets: inherit` keep working.
#
# Each calling repository keeps its own CLAUDE_CODE_OAUTH_TOKEN in an
# environment named `claude`; no repository secret is needed. The caller's job
# cannot name the environment itself (GitHub rejects `environment` alongside
# `uses`), so the job below does, and a secret passed by name resolves from that
# environment even when only the environment holds it. If a repository secret
# has the same name, the environment's value wins.
#
# To let the review approve, the calling repository must allow it: Settings →
# Actions → General → Workflow permissions → "Allow GitHub Actions to create
# and approve pull requests". New organizations turn this off, and their
# repositories inherit it, so for an organization repository enable it in the
# organization's settings first. Without it, GitHub rejects an APPROVE review,
# and the job posts that verdict as a COMMENT review instead.
on:
  workflow_call:
    inputs:
      # Only set when the caller was dispatched by hand. A called workflow's
      # inputs context holds what the caller passes in `with`, not the caller's
      # own workflow_dispatch inputs, so the caller forwards it explicitly.
      pr_number:
        description: PR number to review (manual runs only)
        required: false
        type: string
    secrets:
      # Declared so a caller can pass it by name: passing a secret the called
      # workflow does not declare is a validation error. Not `required: true`,
      # because that only checks that the caller names the secret, not that it
      # has a value, so it would not catch an empty token. The "Check the token
      # reached this job" step below does.
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token, stored in the calling repository's `claude` environment
        required: false

jobs:
  review:
    # CI also runs on pushes to main and on manual dispatch, and
    # workflow_run fires for all of them. Only a pull_request run has something to
    # review. Cancelled and skipped runs produced no result to read.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    # A full multi-agent review takes 3–6 minutes. The cap is a backstop so a
    # stuck run (a hung subagent, or an API retry loop near a usage limit) fails
    # fast as "Review did not complete" instead of holding a runner for the
    # default 6 hours. The status step still runs on timeout.
    timeout-minutes: 30
    # Scopes CLAUDE_CODE_OAUTH_TOKEN to this environment. Secrets stored on an
    # environment are invisible to a job that does not name it, so without this
    # line the token resolves to empty and the action fails on auth. Naming the
    # environment is not enough on its own: the caller still has to pass the
    # secret, by name or with `secrets: inherit` (see the header). Keep the
    # environment free of required reviewers or wait timers: a protection rule
    # here would park every review run pending an approval.
    environment: claude
    permissions:
      contents: read # the review never writes code; sweep runs elsewhere
      pull-requests: write # only for the review submitted below
      issues: write # only for the nit-backlog issue; grants nothing over code
      actions: read # to read the upstream CI run and its logs
      id-token: write
      statuses: write # the "Claude Code Review" row on the PR's check list
    steps:
      # workflow_run's payload does not carry the pull request reliably — the
      # pull_requests array is empty for fork runs and inconsistent otherwise — so
      # resolve it from the head SHA instead.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$INPUT_PR"
            CI_CONCLUSION="not available (manual run, no upstream CI)"
            CI_URL="none"
          else
            PR=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls" \
                   --jq 'map(select(.state == "open")) | .[0].number // empty')
            CI_CONCLUSION="$RUN_CONCLUSION"
            CI_URL="${{ github.server_url }}/$REPO/actions/runs/$RUN_ID"
          fi

          if [ -z "$PR" ]; then
            echo "No open pull request for $RUN_SHA — nothing to review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR can be merged or closed while CI is still running.
          read -r STATE DRAFT HEAD_SHA < <(gh api "repos/$REPO/pulls/$PR" \
            --jq '[.state, (.draft|tostring), .head.sha] | @tsv')
          if [ "$STATE" != "open" ]; then
            echo "PR #$PR is $STATE — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A draft is skipped on the automatic path but reviewed on a manual
          # dispatch, because asking for it by hand is explicit intent — the same
          # split Anthropic's managed Code Review makes. It is also the only way
          # to review an in-progress branch, since marking a draft ready does not
          # re-run a CI workflow whose pull_request trigger has no type filter.
          if [ "$DRAFT" = "true" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "PR #$PR is a draft and this run is automatic — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "skip=false"
            echo "number=$PR"
            echo "head_sha=$HEAD_SHA"
            echo "ci_conclusion=$CI_CONCLUSION"
            echo "ci_url=$CI_URL"
          } >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$PR at $HEAD_SHA (CI: $CI_CONCLUSION)"

      # A secret the caller did not pass resolves to an empty string without any
      # error, and the action then fails with a message that names no cause.
      # Failing here says what is wrong. It runs after the pull request is
      # resolved so that skipped runs stay green, and the status step at the end
      # still marks the PR's review row as failed.
      - name: Check the token reached this job
        if: steps.pr.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty in this job. Store it in the calling repository's 'claude' environment, and pass it from the calling workflow by name under 'secrets:'. 'secrets: inherit' passes nothing when the calling repository has a different owner from billy-the-ape/claude-plugins."
            exit 1
          fi

      # A workflow_run job's own check attaches to the default branch's commit, so
      # it never appears on the pull request. A commit status on the PR head SHA
      # does, which is why the review's progress is mirrored there. Do not make it
      # a required check: skipped runs (closed, draft) post no status at all.
      - name: Mark the review as running
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending -f context="Claude Code Review" \
            -f description="Review in progress" -f target_url="$RUN_URL"

      # workflow_run runs in the default branch's context, so the head ref has to
      # be explicit. Checking out head is safe here because the tool grant below
      # has no build or test command: nothing from the pull request executes.
      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip != 'true'
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.pr.outputs.skip != 'true'
        env:
          # For the read-only gh calls in the allowlist below; the job token
          # already has pull-requests: read via write and actions: read.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Temporary, until one run posts a review: the job log is where a denied
          # tool call shows up, including a Skill denial that would make the
          # delegation below quietly not happen. Drop it once this is working.
          show_full_output: true
          additional_permissions: |
            actions: read
          # Both marketplaces: reviewer:review delegates the review itself to
          # Anthropic's code-review skill rather than reimplementing it.
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/billy-the-ape/claude-plugins.git
          plugins: |
            code-review@claude-code-plugins
            reviewer@ape-plugins
          prompt: >-
            /reviewer:review ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}
            CI has already run on this commit and concluded:
            ${{ steps.pr.outputs.ci_conclusion }}. Its logs are at
            ${{ steps.pr.outputs.ci_url }} — read that rather than running the
            suite yourself, with `gh run view <run id> --log-failed`. CI is
            context, not a substitute for the review: still read, at minimum,
            every changed file in the pull request diff, and do not stop at
            the CI result.
            Read unchanged but related files as needed, sparingly, when more
            context demands.
            State in the summary exactly which files you read, flagging unedited but
            related files as (related).
            Return the final verdict as your structured output; do not write
            a verdict file. Besides the existing fields, include "comments":
            an array of inline review
            comments, one per important finding, each
            {"path": "<file>", "line": <line number in the new version of the
            file, inside the PR diff>, "body": "<the finding and, if small, the
            fix>"}. Use an empty array when there are none. Do not post comments
            yourself; the workflow submits them from the verdict.
            Nits that have a clear, mechanical, single-location fix also go in
            "comments", not in "nits": make the body a short note followed by a
            GitHub suggestion block (a fenced block with the language
            "suggestion" containing the exact replacement for the line or lines
            commented on) so it can be applied in one click. Use "nits" only for
            nits that are unclear or too large for a suggestion; those still go
            to the backlog issue.
          # --allowedTools is the entire pre-approved set, not an addition to a
          # default one. Skill is permissioned, so the delegation needs it named
          # here. git subcommands are listed individually because a bare
          # Bash(git *) also permits `git -c <key>=<program>`, which runs
          # arbitrary programs. No build or test command is granted, and no write
          # tool: the verdict comes back as structured output, and the step after
          # this one writes it to disk. (The reviewer skill's own frontmatter still
          # pre-approves writing the verdict file for callers without a schema;
          # that step overwrites it here.)
          #
          # The gh entries are read-only subcommands, and they are required: the
          # delegated code-review skill starts with `gh pr view`, and the prompt
          # sends the agent to the upstream run's logs with `gh run view`. Without
          # them every call is denied (run 37817935519), the review cannot finish,
          # and no verdict is written.
          #
          # --disallowedTools is what keeps posting out of the agent's hands. A
          # skill's allowed-tools frontmatter pre-approves tools rather than
          # restricting them, and the delegated code-review skill's grant includes
          # `gh pr comment`, which it uses when given --comment. Deny rules win
          # over every allow rule, a skill's included, so the review is posted only
          # by the steps below. That plugin installs from its main branch, so the
          # deny list also holds if its grant grows later.
          #
          # Agent (and Task, its older name) lets the delegated skill run its
          # subagents: parallel reviewers, then a validator per finding. Without it
          # the skill degrades to one solo pass (kanban run 38276833337 reported
          # `subagent_stats.spawned: 0`). Subagents inherit this same tool grant.
          # Check `spawned` in the job log after a change here.
          #
          # --json-schema is the verdict's shape. When no verdict matching it comes
          # back, the action fails this step, so the run still reports "Review did
          # not complete" instead of posting nothing under a green check. The schema
          # sits inside single quotes, so keep single quotes out of it.
          claude_args: >-
            --effort high
            --json-schema '{"type": "object",
            "required": ["event", "summary", "important", "nits", "comments"],
            "properties": {
            "event": {"type": "string", "enum": ["APPROVE", "REQUEST_CHANGES", "COMMENT"]},
            "summary": {"type": "string"},
            "important": {"type": "integer", "minimum": 0},
            "nits": {"type": "array", "items": {"type": "object", "required": ["path", "note"],
            "properties": {"path": {"type": "string"}, "line": {"type": "integer"}, "note": {"type": "string"}}}},
            "comments": {"type": "array", "items": {"type": "object", "required": ["path", "line", "body"],
            "properties": {"path": {"type": "string"}, "line": {"type": "integer"}, "body": {"type": "string"}}}}}}'
            --allowedTools "Skill,Agent,Task,Read,Grep,Glob,Bash(git diff *),Bash(git log *),Bash(git status *),Bash(git rev-parse *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh run view *)"
            --disallowedTools "Bash(gh pr comment *),Bash(gh pr review *),Bash(gh issue comment *),Bash(gh api *),mcp__github_inline_comment__create_inline_comment"

      # The verdict arrives as the action's structured output. It is written to
      # the file the steps below read, which also replaces any
      # .claude-review-verdict.json the pull request itself commits.
      - name: Read the verdict
        id: verdict
        if: steps.pr.outputs.skip != 'true'
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -z "$VERDICT" ]; then
            echo "::error::The review returned no verdict. It did not complete; see the step above."
            exit 1
          fi
          printf '%s' "$VERDICT" | jq . > .claude-review-verdict.json
          cat .claude-review-verdict.json
          echo "event=$(jq -r '.event' .claude-review-verdict.json)" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<VERDICT_EOF'
            jq -r '.summary' .claude-review-verdict.json
            echo 'VERDICT_EOF'
          } >> "$GITHUB_OUTPUT"

      # The review is submitted here, from the verdict, rather than by Claude. The
      # agent never holds approval power; the approval is a mechanical consequence
      # of the findings. github-actions[bot] is a different identity from the PR
      # author, so it can approve pull requests you opened yourself, provided the
      # repository lets GitHub Actions approve (see the header).
      - name: Submit the review
        id: submit
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          REVIEW_EVENT: ${{ steps.verdict.outputs.event }}
          REVIEW_BODY: ${{ steps.verdict.outputs.summary }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          APPROVAL_NOTE: >-
            This review would have approved, but this repository does not allow
            GitHub Actions to approve pull requests, so it is posted as a comment.
            To let it approve, enable "Allow GitHub Actions to create and approve
            pull requests" under Settings → Actions → General → Workflow
            permissions. For an organization repository, enable it in the
            organization's settings first.
        run: |
          set -euo pipefail
          # Inline comments come from the verdict's "comments" array. The action's
          # own inline-comment tool is unavailable here: it is only registered for
          # pull_request-style events, and this job runs on workflow_run or
          # workflow_dispatch.
          PAYLOAD=$(jq -c --arg event "$REVIEW_EVENT" --arg body "$REVIEW_BODY" \
            --arg sha "$HEAD_SHA" '{
              event: $event, body: $body, commit_id: $sha,
              comments: [(.comments // [])[]
                | select(.path and .line and .body)
                | {path, line, side: "RIGHT", body}]
            }' .claude-review-verdict.json)

          # Prints GitHub's response whether or not the call succeeds, and keeps
          # it in RESPONSE so the loop below can tell one rejection from another.
          submit() {
            local status=0
            RESPONSE=$(gh api "repos/$REPO/pulls/$PR/reviews" --input - \
                         <<< "$PAYLOAD" 2>&1) || status=$?
            printf '%s\n' "$RESPONSE"
            return "$status"
          }

          # GitHub rejects the whole review (422) for either of two causes, and
          # reports one at a time, so each retry removes one and tries again:
          # - "GitHub Actions is not permitted to approve pull requests": the
          #   repository setting in the header is off. Post as COMMENT with a note
          #   instead of losing the review.
          # - any other rejection while there are inline comments: a comment line
          #   is likely outside the diff. Post the summary alone.
          # Each fix applies at most once, so this makes at most three attempts.
          DOWNGRADED=false
          until submit; do
            if [ "$(jq -r '.event' <<< "$PAYLOAD")" = APPROVE ] &&
               grep -q 'not permitted to approve pull requests' <<< "$RESPONSE"; then
              echo "::warning::GitHub Actions may not approve pull requests in this repository; posting the APPROVE verdict as a COMMENT review."
              PAYLOAD=$(jq -c --arg note "$APPROVAL_NOTE" \
                '.event = "COMMENT" | .body = "> [!NOTE]\n> " + $note + "\n\n" + .body' \
                <<< "$PAYLOAD")
              DOWNGRADED=true
            elif [ "$(jq '.comments | length' <<< "$PAYLOAD")" -gt 0 ]; then
              echo "::warning::Review with inline comments was rejected; posting the summary only."
              PAYLOAD=$(jq -c 'del(.comments)' <<< "$PAYLOAD")
            else
              echo "::error::GitHub rejected the review; its response is above."
              exit 1
            fi
          done

          {
            echo "event=$(jq -r '.event' <<< "$PAYLOAD")"
            echo "downgraded=$DOWNGRADED"
          } >> "$GITHUB_OUTPUT"

      # Runs on failure and cancellation too, so a broken review shows as a red
      # row on the PR instead of leaving the pending status stuck. head_sha is
      # empty when the PR could not be resolved or the run was skipped, and then
      # there is no pending status to replace.
      - name: Report the review result
        if: always() && steps.pr.outputs.skip == 'false' && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          # What was posted, which differs from the verdict when an APPROVE had
          # to go out as a COMMENT.
          REVIEW_EVENT: ${{ steps.submit.outputs.event || steps.verdict.outputs.event }}
          DOWNGRADED: ${{ steps.submit.outputs.downgraded }}
        run: |
          POSTED="${REVIEW_EVENT:-done}"
          if [ "$DOWNGRADED" = true ]; then
            POSTED="$POSTED (Actions may not approve PRs here)"
          fi
          case "$JOB_STATUS" in
            success)   STATE=success; DESC="Review posted: $POSTED" ;;
            cancelled) STATE=error;   DESC="Review cancelled" ;;
            *)         STATE=failure; DESC="Review did not complete" ;;
          esac
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="Claude Code Review" \
            -f description="$DESC" -f target_url="$RUN_URL"

      # The nits are already in the verdict, so there is no discovery pass. This
      # step is the only thing holding issue write, and it runs after the review
      # so a backlog hiccup cannot stop the review from being posted.
      - name: Record nits in the backlog issue
        if: steps.pr.outputs.skip != 'true' && steps.verdict.outputs.event != 'COMMENT'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.head_sha }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # Found by label, never by a hardcoded number, so this ports to other repos.
          ISSUE=$(gh issue list --repo "$REPO" --label nit-backlog --state open \
                    --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$ISSUE" ]; then
            gh label create nit-backlog --repo "$REPO" --color ededed \
              --description "Review nits awaiting a sweep" 2>/dev/null || true
            URL=$(gh issue create --repo "$REPO" --label nit-backlog \
              --title "Nit backlog" \
              --body "Nits recorded by Claude code review, grouped by the pull request that surfaced them. \`/reviewer:sweep\` clears them in batches.

          Ticking a box means fixed. If a nit is still in the code, the next review of that PR reports it again and rewrites its block, so a tick that does not reflect reality will come back. To stop a nit being reported at all, add the rule to AGENTS.md rather than ticking it here.")
            ISSUE="${URL##*/}"
            echo "Created backlog issue #$ISSUE"
          fi

          BODY="$RUNNER_TEMP/backlog.md"
          gh issue view "$ISSUE" --repo "$REPO" --json body --jq .body > "$BODY"

          python3 - "$BODY" <<'PY'
          import json, os, pathlib, re, sys

          pr, sha = os.environ["PR"], os.environ["SHA"]
          server, repo = os.environ["SERVER"], os.environ["REPO"]
          body_file = pathlib.Path(sys.argv[1])
          nits = json.load(open(".claude-review-verdict.json")).get("nits") or []

          begin, end = f"<!-- nits:pr-{pr} -->", f"<!-- /nits:pr-{pr} -->"
          rows = []
          for n in nits:
              path = n["path"]
              loc = f"{path}:{n['line']}" if n.get("line") else path
              anchor = f"#L{n['line']}" if n.get("line") else ""
              note = str(n.get("note", "")).strip()
              rows.append(f"- [ ] [`{loc}`]({server}/{repo}/blob/{sha}/{path}{anchor}) — {note}")
          block = "\n".join([begin, "", f"**[#{pr}]({server}/{repo}/pull/{pr})**", "", *rows, "", end])

          body = body_file.read_text()
          pattern = re.compile(re.escape(begin) + r".*?" + re.escape(end), re.S)
          if not nits:
              new = re.sub(r"\n{3,}", "\n\n", pattern.sub("", body)).rstrip() + "\n"
          elif pattern.search(body):
              new = pattern.sub(block, body)
          else:
              new = body.rstrip() + "\n\n" + block + "\n"
          body_file.write_text(new)
          print(f"recorded {len(nits)} nit(s) for PR {pr}")
          PY

          gh issue edit "$ISSUE" --repo "$REPO" --body-file "$BODY"
          echo "Backlog: $SERVER/$REPO/issues/$ISSUE"
